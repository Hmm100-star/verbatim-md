[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatim-md"
version = "0.1.0"
description = "Evidence-preserving Markdown to Verbatim-oriented DOCX converter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Verbatim-MD contributors"}]
dependencies = ["python-docx>=1.1,<2", "PyYAML>=6,<7", "defusedxml>=0.7,<1"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7", "build>=1.2,<2", "twine>=6,<7", "setuptools>=83,<84", "wheel>=0.44,<1"]

[project.scripts]
verbatim-md = "verbatim_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
